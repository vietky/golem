apiVersion: v1
kind: Secret
metadata:
  name: firebase-auth-secret
  namespace: golem
type: Opaque
stringData:
  GOOGLE_OAUTH_CLIENT_ID: ""  # Set in secrets folder
  GOOGLE_OAUTH_CLIENT_SECRET: ""  # Set in secrets folder
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firebase-auth-config
  namespace: golem
data:
  GOOGLE_OAUTH_REDIRECT_URL: "https://game.anhtran.dev/auth/google/callback"
  SESSION_COOKIE_DOMAIN: ".anhtran.dev"
  FIREBASE_CREDENTIALS_FILE: "/etc/firebase/firebase-credentials.json"
