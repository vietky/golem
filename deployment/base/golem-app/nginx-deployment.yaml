apiVersion: apps/v1
kind: Deployment
metadata:
  name: golem-nginx
  labels:
    app: golem
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golem
      tier: frontend
  template:
    metadata:
      labels:
        app: golem
        tier: frontend
      annotations:
        # Force pod restart on each deployment
        deployment.kubernetes.io/restart: "0"
    spec:
      containers:
      - name: nginx
        image: localhost:5000/golem-frontend:latest
        # Always pull the latest image on pod restart
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /apps/golem/
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /apps/golem/
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
      # Force new pod on every update
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: golem-nginx
  labels:
    app: golem
    tier: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: golem
    tier: frontend
