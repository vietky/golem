apiVersion: apps/v1
kind: Deployment
metadata:
  name: golem-century
  labels:
    app: golem
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golem
      tier: backend
  template:
    metadata:
      labels:
        app: golem
        tier: backend
    spec:
      containers:
      - name: golem-century
        image: localhost:5000/golem-century:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: golem-app-config
        - configMapRef:
            name: firebase-auth-config
        - secretRef:
            name: config-golem
            optional: true
        - secretRef:
            name: firebase-auth-secret
            optional: true
        env:
        - name: FIREBASE_CREDENTIALS_FILE
          value: "/etc/firebase/firebase-credentials.json"
        # Uncomment below to use secrets (requires creating secret first)
        # - name: TELEGRAM_BOT_TOKEN
        #   valueFrom:
        #     secretKeyRef:
        #       name: golem-secrets
        #       key: TELEGRAM_BOT_TOKEN
        # - name: TELEGRAM_CHAT_ID
        #   valueFrom:
        #     secretKeyRef:
        #       name: golem-secrets
        #       key: TELEGRAM_CHAT_ID
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: firebase-credentials
          mountPath: /etc/firebase
          readOnly: true
      volumes:
      - name: firebase-credentials
        secret:
          secretName: firebase-golem
          optional: true
