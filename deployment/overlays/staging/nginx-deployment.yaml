apiVersion: apps/v1
kind: Deployment
metadata:
  name: golem-nginx
  labels:
    app: golem
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golem
      tier: frontend
  template:
    metadata:
      labels:
        app: golem
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: localhost:5000/golem-frontend:staging
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /apps/golem-staging/
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /apps/golem-staging/
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: golem-nginx
  labels:
    app: golem
    tier: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: golem
    tier: frontend
