apiVersion: apps/v1
kind: Deployment
metadata:
  name: golem-nginx-staging
  labels:
    app: golem
    environment: staging
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golem
      environment: staging
      tier: frontend
  template:
    metadata:
      labels:
        app: golem
        environment: staging
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: frontend-storage
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: frontend-storage
        persistentVolumeClaim:
          claimName: golem-frontend-staging-pvc
      - name: nginx-config
        configMap:
          name: golem-nginx-staging-config
---
apiVersion: v1
kind: Service
metadata:
  name: golem-nginx-staging
  labels:
    app: golem
    environment: staging
    tier: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: golem
    environment: staging
    tier: frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: golem-nginx-staging-config
  labels:
    app: golem
    environment: staging
    tier: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    }
