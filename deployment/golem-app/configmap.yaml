apiVersion: v1
kind: ConfigMap
metadata:
  name: golem-app-config
  namespace: golem
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  MONGO_URI: "mongodb://mongodb.golem-database.svc.cluster.local:27017"
  MONGO_DB: "golem_game"
  REDIS_ADDR: "redis.golem-cache.svc.cluster.local:6379"
  REDIS_DB: "0"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
