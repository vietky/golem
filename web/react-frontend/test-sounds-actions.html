<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound System Test - Game Actions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 30px;
      backdrop-filter: blur(10px);
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .test-section {
      margin: 20px 0;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    .test-section h2 {
      margin-top: 0;
      color: #ffd700;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 12px 24px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    button:active {
      transform: translateY(0);
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 5px;
      font-family: monospace;
    }
    .mute-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      padding: 15px 25px;
      border-radius: 50px;
      font-size: 18px;
    }
    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    .success {
      color: #4ade80;
    }
    .error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Game Sounds Test</h1>
    
    <button class="mute-toggle" id="muteToggle">🔊 Unmuted</button>
    
    <div class="test-section">
      <h2>🎵 Individual Sound Tests</h2>
      <p>Click each button to test individual sounds:</p>
      <div class="test-grid">
        <button onclick="testSound('playCard')">🃏 Play Card</button>
        <button onclick="testSound('acquireMerchant')">🛒 Acquire Merchant</button>
        <button onclick="testSound('claimPointCard')">🏆 Claim Golem</button>
        <button onclick="testSound('rest')">😴 Rest</button>
        <button onclick="testSound('myTurn')">⏰ My Turn</button>
        <button onclick="testSound('nearlyEnd')">⚠️ Nearly End (4 Golems)</button>
        <button onclick="testSound('gameOver')">🎊 Game Over</button>
      </div>
      <div class="status" id="soundStatus">Ready to test sounds...</div>
    </div>
    
    <div class="test-section">
      <h2>🎬 Action Simulation Tests</h2>
      <p>Simulate game actions to test sound triggers:</p>
      <div class="test-grid">
        <button onclick="simulatePlayCard()">Simulate: Play Card</button>
        <button onclick="simulateAcquireCard()">Simulate: Acquire Card</button>
        <button onclick="simulateClaimGolem()">Simulate: Claim Golem</button>
        <button onclick="simulateRest()">Simulate: Rest</button>
        <button onclick="simulateTurnChange()">Simulate: Turn Change</button>
        <button onclick="simulate4Golems()">Simulate: 4 Golems</button>
        <button onclick="simulateGameOver()">Simulate: Game Over</button>
      </div>
      <div class="status" id="simulationStatus">
        <div><strong>State:</strong> <span id="gameStateDisplay">Not started</span></div>
        <div><strong>My Player:</strong> <span id="myPlayerDisplay">-</span></div>
        <div><strong>Current Turn:</strong> <span id="currentTurnDisplay">-</span></div>
      </div>
    </div>
    
    <div class="test-section">
      <h2>📊 Sound Loading Status</h2>
      <div class="status" id="loadStatus">Checking sound files...</div>
    </div>
  </div>

  <script>
    // Sound Manager Implementation (same as in the app)
    class SoundManager {
      constructor() {
        this.sounds = {};
        this.currentlyPlaying = new Set();
        this.isMuted = false;
        
        this.soundFiles = {
          playCard: '/sounds/play_card.mp3',
          acquireMerchant: '/sounds/acquire_merchant.mp3',
          claimPointCard: '/sounds/claim_point_card.mp3',
          rest: '/sounds/rest.mp3',
          gameOver: '/sounds/game_over.mp3',
          myTurn: '/sounds/my_turn.mp3',
          nearlyEnd: '/sounds/nearly_end.mp3',
        };
        
        const savedMuteState = localStorage.getItem('gameSoundsMuted');
        this.isMuted = savedMuteState === 'true';
        
        this.preloadSounds();
        this.updateMuteButton();
      }
      
      preloadSounds() {
        let loadedCount = 0;
        const totalSounds = Object.keys(this.soundFiles).length;
        
        Object.entries(this.soundFiles).forEach(([key, path]) => {
          const audio = new Audio(path);
          audio.preload = 'auto';
          
          audio.addEventListener('canplaythrough', () => {
            loadedCount++;
            this.updateLoadStatus(key, 'success', loadedCount, totalSounds);
          }, { once: true });
          
          audio.addEventListener('error', (e) => {
            loadedCount++;
            this.updateLoadStatus(key, 'error', loadedCount, totalSounds);
          }, { once: true });
          
          this.sounds[key] = audio;
        });
      }
      
      updateLoadStatus(soundName, status, loaded, total) {
        const statusDiv = document.getElementById('loadStatus');
        const existingLines = statusDiv.innerHTML.split('<br>').filter(line => 
          !line.includes(soundName) && line.trim() !== ''
        );
        
        const icon = status === 'success' ? '✅' : '❌';
        const className = status === 'success' ? 'success' : 'error';
        existingLines.push(`<span class="${className}">${icon} ${soundName}: ${status}</span>`);
        existingLines.push(`<strong>Loaded: ${loaded}/${total}</strong>`);
        
        statusDiv.innerHTML = existingLines.join('<br>');
      }
      
      play(soundName, allowOverlap = false) {
        if (this.isMuted) {
          document.getElementById('soundStatus').innerHTML = 
            `<span class="error">🔇 Sound muted: ${soundName}</span>`;
          return;
        }
        
        const audio = this.sounds[soundName];
        if (!audio) {
          document.getElementById('soundStatus').innerHTML = 
            `<span class="error">❌ Sound not found: ${soundName}</span>`;
          return;
        }
        
        if (!allowOverlap && this.currentlyPlaying.has(soundName)) {
          document.getElementById('soundStatus').innerHTML = 
            `<span class="error">⏸️ Already playing: ${soundName}</span>`;
          return;
        }
        
        const soundToPlay = allowOverlap ? audio.cloneNode() : audio;
        
        if (!allowOverlap) {
          soundToPlay.currentTime = 0;
        }
        
        this.currentlyPlaying.add(soundName);
        
        const playPromise = soundToPlay.play();
        
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              document.getElementById('soundStatus').innerHTML = 
                `<span class="success">🔊 Playing: ${soundName}</span>`;
            })
            .catch((error) => {
              document.getElementById('soundStatus').innerHTML = 
                `<span class="error">❌ Error playing ${soundName}: ${error.message}</span>`;
              this.currentlyPlaying.delete(soundName);
            });
        }
        
        soundToPlay.addEventListener('ended', () => {
          this.currentlyPlaying.delete(soundName);
        }, { once: true });
      }
      
      toggleMute() {
        this.isMuted = !this.isMuted;
        localStorage.setItem('gameSoundsMuted', this.isMuted.toString());
        
        if (this.isMuted) {
          Object.values(this.sounds).forEach(audio => {
            audio.pause();
            audio.currentTime = 0;
          });
          this.currentlyPlaying.clear();
        }
        
        this.updateMuteButton();
        return this.isMuted;
      }
      
      updateMuteButton() {
        const button = document.getElementById('muteToggle');
        if (button) {
          button.textContent = this.isMuted ? '🔇 Muted' : '🔊 Unmuted';
        }
      }
    }

    // Initialize sound manager
    const soundManager = new SoundManager();
    
    // Test individual sounds
    function testSound(soundName) {
      soundManager.play(soundName);
    }
    
    // Simulation state
    let gameState = {
      myPlayer: { id: 1, hand: [], playedCards: [], pointCards: [] },
      currentPlayer: { id: 1 },
      players: [
        { id: 1, hand: [], playedCards: [], pointCards: [] },
        { id: 2, hand: [], playedCards: [], pointCards: [] }
      ]
    };
    
    function updateDisplay() {
      const myPlayer = gameState.myPlayer;
      document.getElementById('myPlayerDisplay').textContent = 
        `Hand: ${myPlayer.hand.length}, Played: ${myPlayer.playedCards.length}, Golems: ${myPlayer.pointCards.length}`;
      document.getElementById('currentTurnDisplay').textContent = 
        `Player ${gameState.currentPlayer.id}`;
      document.getElementById('gameStateDisplay').textContent = 'Active';
    }
    
    function simulatePlayCard() {
      gameState.myPlayer.playedCards.push({ id: Date.now() });
      soundManager.play('playCard');
      updateDisplay();
      document.getElementById('simulationStatus').innerHTML += '<br><span class="success">✅ Played a card</span>';
    }
    
    function simulateAcquireCard() {
      gameState.myPlayer.hand.push({ id: Date.now() });
      soundManager.play('acquireMerchant');
      updateDisplay();
      document.getElementById('simulationStatus').innerHTML += '<br><span class="success">✅ Acquired a card</span>';
    }
    
    function simulateClaimGolem() {
      gameState.myPlayer.pointCards.push({ id: Date.now() });
      soundManager.play('claimPointCard');
      updateDisplay();
      document.getElementById('simulationStatus').innerHTML += '<br><span class="success">✅ Claimed a golem</span>';
    }
    
    function simulateRest() {
      gameState.myPlayer.hand.push(...gameState.myPlayer.playedCards);
      gameState.myPlayer.playedCards = [];
      soundManager.play('rest');
      updateDisplay();
      document.getElementById('simulationStatus').innerHTML += '<br><span class="success">✅ Rested</span>';
    }
    
    function simulateTurnChange() {
      gameState.currentPlayer.id = gameState.currentPlayer.id === 1 ? 2 : 1;
      if (gameState.currentPlayer.id === 1) {
        soundManager.play('myTurn');
      }
      updateDisplay();
      document.getElementById('simulationStatus').innerHTML += 
        `<br><span class="success">✅ Turn changed to Player ${gameState.currentPlayer.id}</span>`;
    }
    
    function simulate4Golems() {
      while (gameState.myPlayer.pointCards.length < 4) {
        gameState.myPlayer.pointCards.push({ id: Date.now() + Math.random() });
      }
      soundManager.play('nearlyEnd', true);
      updateDisplay();
      document.getElementById('simulationStatus').innerHTML += '<br><span class="success">⚠️ Someone has 4 golems!</span>';
    }
    
    function simulateGameOver() {
      soundManager.play('gameOver', true);
      document.getElementById('gameStateDisplay').textContent = 'Game Over';
      document.getElementById('simulationStatus').innerHTML += '<br><span class="success">🎊 Game Over!</span>';
    }
    
    // Mute toggle
    document.getElementById('muteToggle').addEventListener('click', () => {
      soundManager.toggleMute();
    });
    
    // Initialize display
    updateDisplay();
  </script>
</body>
</html>
