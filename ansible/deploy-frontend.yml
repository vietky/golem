---
- name: Deploy Golem Century Frontend to Kubernetes PVC
  hosts: k3s_cluster
  become: yes
  vars:
    # Environment: 'test' or 'prod'
    deploy_env: "{{ lookup('env', 'DEPLOY_ENV') | default('test', true) }}"
    deploy_branch: "{{ lookup('env', 'DEPLOY_BRANCH') | default('main', true) }}"
    git_repo_path: "/opt/jenkins/repos/golem"
    temp_build_dir: "/tmp/golem-frontend-build"
    
    # Environment-specific configuration
    env_config:
      test:
        namespace: "staging"
        pvc_name: "golem-frontend-staging-pvc"
        api_host: "https://game.anhtran.dev"
        nginx_host: "https://game.anhtran.dev"
        url_path: "/golem-test"
        deployment_name: "golem-century-staging"
      prod:
        namespace: "default"
        pvc_name: "golem-frontend-pvc"
        api_host: "https://game.anhtran.dev"
        nginx_host: "https://game.anhtran.dev"
        url_path: "/golem"
        deployment_name: "golem-century"

  pre_tasks:
    - name: Validate deploy environment
      fail:
        msg: "DEPLOY_ENV must be either 'test' or 'prod', got: {{ deploy_env }}"
      when: deploy_env not in ['test', 'prod']

    - name: Display deployment environment
      debug:
        msg:
          - "Deploying frontend to: {{ deploy_env | upper }} environment"
          - "Git repo: {{ git_repo_path }}"
          - "Namespace: {{ env_config[deploy_env].namespace }}"
          - "PVC: {{ env_config[deploy_env].pvc_name }}"
          - "API host: {{ env_config[deploy_env].api_host }}"
          - "Access URL: {{ env_config[deploy_env].nginx_host }}{{ env_config[deploy_env].url_path }}"
          - "Branch: {{ deploy_branch }}"

  tasks:
    - name: Verify git repository exists
      stat:
        path: "{{ git_repo_path }}"
      register: git_repo_check
      failed_when: not git_repo_check.stat.exists
      changed_when: false

    - name: Pull latest code from git repository
      shell: |
        cd {{ git_repo_path }}
        git fetch origin {{ deploy_branch }}
        git checkout {{ deploy_branch }}
        git reset --hard origin/{{ deploy_branch }}
      register: git_pull_result
      changed_when: "'Already up to date' not in git_pull_result.stdout"

    - name: Display git pull result
      debug:
        msg: "{{ git_pull_result.stdout_lines }}"

    - name: Create temporary build directory
      file:
        path: "{{ temp_build_dir }}"
        state: directory
        mode: '0755'

    - name: Check if Docker is installed
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      debug:
        msg: "Using {{ docker_version.stdout }}"

    - name: Build frontend Docker image for {{ deploy_env }} environment
      shell: |
        cd {{ git_repo_path }}
        docker build \
          --build-arg VITE_API_HOST={{ env_config[deploy_env].api_host }} \
          --build-arg VITE_NGINX_HOST={{ env_config[deploy_env].nginx_host }} \
          -f Dockerfile.fe \
          -t golem-frontend:{{ deploy_env }}-latest \
          .
      register: docker_build_result

    - name: Display Docker build result
      debug:
        msg: "Docker build completed successfully"

    - name: Run Docker container to extract built frontend
      shell: |
        docker run --rm \
          -v {{ temp_build_dir }}:/nginx-dest \
          golem-frontend:{{ deploy_env }}-latest \
          sh -c "cp -r /app/dist/* /nginx-dest/"
      register: docker_run_result

    - name: Verify build output exists
      stat:
        path: "{{ temp_build_dir }}"
      register: build_output_check
      failed_when: not build_output_check.stat.exists

    - name: List build output files
      shell: "ls -la {{ temp_build_dir }} | head -20"
      register: build_files

    - name: Display build files
      debug:
        msg: "{{ build_files.stdout_lines }}"

    - name: Ensure namespace exists
      shell: |
        kubectl get namespace {{ env_config[deploy_env].namespace }} || \
        kubectl create namespace {{ env_config[deploy_env].namespace }}
      register: namespace_check

    - name: Apply frontend PVC manifest
      shell: |
        cd {{ git_repo_path }}
        if [ "{{ deploy_env }}" = "test" ]; then
          kubectl apply -f deployment/overlays/staging/frontend-pvc.yaml -n {{ env_config[deploy_env].namespace }}
        else
          kubectl apply -f deployment/golem-app/frontend-pvc.yaml -n {{ env_config[deploy_env].namespace }}
        fi
      register: pvc_apply

    - name: Display PVC status
      debug:
        msg: "PVC will be bound when pod is created (local-path provisioner behavior)"

    - name: Create temporary pod to copy frontend files
      shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: frontend-copy-{{ deploy_env }}
          namespace: {{ env_config[deploy_env].namespace }}
          labels:
            app: golem
            tier: frontend-temp
        spec:
          containers:
          - name: copy-container
            image: busybox
            command: ['sh', '-c', 'sleep 3600']
            volumeMounts:
            - name: frontend-storage
              mountPath: /frontend
          volumes:
          - name: frontend-storage
            persistentVolumeClaim:
              claimName: {{ env_config[deploy_env].pvc_name }}
          restartPolicy: Never
        EOF
      register: pod_create

    - name: Wait for copy pod to be ready
      shell: |
        kubectl wait --for=condition=Ready pod/frontend-copy-{{ deploy_env }} \
          -n {{ env_config[deploy_env].namespace }} --timeout=60s
      register: pod_wait
      retries: 5
      delay: 5
      until: pod_wait.rc == 0

    - name: Clean existing frontend files in PVC
      shell: |
        kubectl exec -n {{ env_config[deploy_env].namespace }} frontend-copy-{{ deploy_env }} -- \
          sh -c 'rm -rf /frontend/*'
      register: clean_pvc

    - name: Copy frontend files to PVC via kubectl cp
      shell: |
        kubectl cp {{ temp_build_dir }}/. \
          {{ env_config[deploy_env].namespace }}/frontend-copy-{{ deploy_env }}:/frontend/
      register: copy_to_pvc

    - name: Verify files in PVC
      shell: |
        kubectl exec -n {{ env_config[deploy_env].namespace }} frontend-copy-{{ deploy_env }} -- \
          ls -la /frontend/
      register: verify_files

    - name: Display files in PVC
      debug:
        msg: "{{ verify_files.stdout_lines }}"

    - name: Verify index.html exists in PVC
      shell: |
        kubectl exec -n {{ env_config[deploy_env].namespace }} frontend-copy-{{ deploy_env }} -- \
          test -f /frontend/index.html && echo "exists" || echo "missing"
      register: index_check
      failed_when: "'missing' in index_check.stdout"

    - name: Delete temporary copy pod
      shell: |
        kubectl delete pod frontend-copy-{{ deploy_env }} -n {{ env_config[deploy_env].namespace }} --ignore-not-found=true
      register: pod_delete

    - name: Deploy static assets to shared location (if needed)
      shell: |
        if [ -d "{{ git_repo_path }}/web/static" ]; then
          mkdir -p /opt/nginx/apps/assets
          cp -r {{ git_repo_path }}/web/static/* /opt/nginx/apps/assets/
          find /opt/nginx/apps/assets -type d -exec chmod 755 {} \;
          find /opt/nginx/apps/assets -type f -exec chmod 644 {} \;
          chown -R www-data:www-data /opt/nginx/apps/assets 2>/dev/null || true
          echo "Static assets deployed"
        else
          echo "Static assets directory not found"
        fi
      register: static_deploy

    - name: Display static assets deployment result
      debug:
        msg: "{{ static_deploy.stdout }}"

    - name: Clean up temporary build directory
      file:
        path: "{{ temp_build_dir }}"
        state: absent

    - name: Display deployment summary
      debug:
        msg:
          - "========================================="
          - "Frontend Deployment Complete!"
          - "========================================="
          - "Environment: {{ deploy_env | upper }}"
          - "Namespace: {{ env_config[deploy_env].namespace }}"
          - "PVC: {{ env_config[deploy_env].pvc_name }}"
          - "Frontend URL: {{ env_config[deploy_env].nginx_host }}{{ env_config[deploy_env].url_path }}"
          - "API Endpoint: {{ env_config[deploy_env].api_host }}"
          - "Static Assets: /opt/nginx/apps/assets"
          - "========================================"
          - "Next steps:"
          - "1. Ensure nginx deployment mounts this PVC"
          - "2. Configure nginx to serve from PVC mount point"
          - "========================================"
