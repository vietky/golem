---
- name: Deploy Golem Frontend to K3s
  hosts: k3s_cluster
  become: yes
  vars:
    deploy_env: "{{ lookup('env', 'DEPLOY_ENV') | default('prod', true) }}"
    git_repo_path: "/opt/jenkins/repos/golem"
    registry_host: "10.100.0.2:5000"
    
    env_config:
      staging:
        namespace: "staging"
        image_tag: "staging"
        deployment_name: "golem-nginx-staging"
        # Set environment variables for frontend build
        vite_api_host: "https://game.anhtran.dev/apps/golem-staging"
        vite_nginx_host: "https://game.anhtran.dev/assets"
        vite_base_path: "/apps/golem-staging/"
      production:
        namespace: "default"
        image_tag: "latest"
        deployment_name: "golem-nginx"
        # Set environment variables for frontend build
        vite_api_host: "https://game.anhtran.dev/apps/golem"
        vite_nginx_host: "https://statics.vietky.io.vn"
        vite_base_path: "/apps/golem/"
  pre_tasks:
    - name: Validate deploy environment
      fail:
        msg: "DEPLOY_ENV must be either 'staging' or 'production'"
      when: deploy_env not in ['staging', 'production']

    - name: Get git commit hash
      shell: |
        cd {{ git_repo_path }}
        git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      register: git_commit
      changed_when: false

    - name: Get current timestamp
      set_fact:
        build_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

    - name: Create versioned image tag
      set_fact:
        versioned_image_tag: "{{ env_config[deploy_env].image_tag }}-{{ build_timestamp }}-{{ git_commit.stdout }}"

    - name: Display deployment info
      debug:
        msg:
          - "Environment: {{ deploy_env | upper }}"
          - "Namespace: {{ env_config[deploy_env].namespace }}"
          - "Base image tag: {{ env_config[deploy_env].image_tag }}"
          - "Versioned image tag: {{ versioned_image_tag }}"
          - "Deployment name: {{ env_config[deploy_env].deployment_name }}"
          - "Git commit: {{ git_commit.stdout }}"
          - "Timestamp: {{ build_timestamp }}"
          - "VITE_API_HOST: {{ env_config[deploy_env].vite_api_host }}"
          - "VITE_NGINX_HOST: {{ env_config[deploy_env].vite_nginx_host }}"

  tasks:
    - name: Verify git repository exists
      stat:
        path: "{{ git_repo_path }}"
      register: git_repo
      failed_when: not git_repo.stat.exists

    - name: Pull latest code
      shell: |
        cd {{ git_repo_path }}
        git fetch origin main
        git checkout main
        git reset --hard origin/main
      register: git_pull

    - name: Create deployment directories
      shell: mkdir -p {{ git_repo_path }}/deployment/base/golem-app/

    - name: Copy nginx config from playbook directory to remote
      copy:
        src: "{{ playbook_dir }}/../deployment/base/golem-app/nginx-frontend.conf"
        dest: "{{ git_repo_path }}/deployment/base/golem-app/nginx-frontend.conf"
        mode: '0644'

    - name: Copy staging-specific nginx config
      copy:
        src: "{{ playbook_dir }}/../deployment/overlays/staging/nginx-frontend.conf"
        dest: "{{ git_repo_path }}/deployment/base/golem-app/nginx-frontend.conf"
        mode: '0644'
      when: deploy_env == 'staging'

    - name: Build frontend Docker image with versioned tag
      shell: |
        cd {{ git_repo_path }}
        docker buildx build \
          --build-arg VITE_API_HOST={{ env_config[deploy_env].vite_api_host }} \
          --build-arg VITE_NGINX_HOST={{ env_config[deploy_env].vite_nginx_host }} \
          --platform linux/amd64 \
          -f Dockerfile.frontend \
          -t golem-frontend:{{ versioned_image_tag }} \
          -t golem-frontend:{{ env_config[deploy_env].image_tag }} \
          .
      register: docker_build
      retries: 0
      delay: 10
      until: docker_build is succeeded

    - name: Tag image for local registry with versioned tag
      shell: |
        docker tag golem-frontend:{{ versioned_image_tag }} \
          {{ registry_host }}/golem-frontend:{{ versioned_image_tag }}
        docker tag golem-frontend:{{ env_config[deploy_env].image_tag }} \
          {{ registry_host }}/golem-frontend:{{ env_config[deploy_env].image_tag }}

    - name: Push versioned image to local registry
      shell: |
        docker push {{ registry_host }}/golem-frontend:{{ versioned_image_tag }}
        docker push {{ registry_host }}/golem-frontend:{{ env_config[deploy_env].image_tag }}
      register: docker_push

    - name: Display build completion
      debug:
        msg:
          - "Frontend image built successfully!"
          - "Versioned tag: {{ registry_host }}/golem-frontend:{{ versioned_image_tag }}"
          - "Latest tag: {{ registry_host }}/golem-frontend:{{ env_config[deploy_env].image_tag }}"

    - name: Patch deployment with new image and update annotation to force pod recreation
      shell: |
        kubectl patch deployment -n {{ env_config[deploy_env].namespace }} \
          {{ env_config[deploy_env].deployment_name }} \
          -p '{"spec":{"template":{"metadata":{"annotations":{"deployment.kubernetes.io/restart":"'$(date +%s)'"}},"spec":{"containers":[{"name":"nginx","image":"{{ registry_host }}/golem-frontend:{{ versioned_image_tag }}"}]}}}}'
      register: kubectl_patch
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Wait for rollout to complete
      shell: |
        kubectl rollout status -n {{ env_config[deploy_env].namespace }} \
          deployment/{{ env_config[deploy_env].deployment_name }} \
          --timeout=180s
      register: rollout_status
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      retries: 3
      delay: 5

    - name: Verify frontend pod is ready
      shell: |
        kubectl get pods -n {{ env_config[deploy_env].namespace }} \
          -l app=golem,tier=frontend \
          -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}'
      register: pod_status
      retries: 10
      delay: 5
      until: pod_status.stdout == 'True'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Get new pod name
      shell: |
        kubectl get pods -n {{ env_config[deploy_env].namespace }} \
          -l app=golem,tier=frontend \
          -o jsonpath='{.items[0].metadata.name}'
      register: pod_name
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Verify running image matches new version
      shell: |
        kubectl get pod -n {{ env_config[deploy_env].namespace }} {{ pod_name.stdout }} \
          -o jsonpath='{.spec.containers[0].image}'
      register: running_image
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Check pod logs for startup errors
      shell: |
        kubectl logs -n {{ env_config[deploy_env].namespace }} {{ pod_name.stdout }} \
          --tail=50 2>&1 | head -20
      register: pod_logs
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Test frontend endpoint with retries
      uri:
        url: "{{ 'https://game.anhtran.dev/apps/golem-staging/' if deploy_env == 'staging' else 'https://game.anhtran.dev/apps/golem/' }}"
        method: GET
        validate_certs: no
        status_code: [200, 304]
      register: frontend_test
      retries: 10
      delay: 3
      until: frontend_test is succeeded
      failed_when: false

    - name: Verify CDN configuration in running pod
      shell: |
        kubectl exec -n {{ env_config[deploy_env].namespace }} {{ pod_name.stdout }} \
          -- grep -r "statics.vietky.io.vn\|{{ env_config[deploy_env].vite_nginx_host }}" /usr/share/nginx/html 2>/dev/null | head -5 || echo "CDN check completed"
      register: cdn_check
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      failed_when: false

    - name: Display deployment success
      debug:
        msg:
          - "================================"
          - "✅ Frontend deployment successful!"
          - "================================"
          - ""
          - "Environment: {{ deploy_env | upper }}"
          - "Namespace: {{ env_config[deploy_env].namespace }}"
          - "Deployment: {{ env_config[deploy_env].deployment_name }}"
          - "Pod: {{ pod_name.stdout }}"
          - ""
          - "Image Information:"
          - "  Built tag: {{ versioned_image_tag }}"
          - "  Running image: {{ running_image.stdout }}"
          - "  Registry: {{ registry_host }}"
          - ""
          - "CDN Configuration:"
          - "  CDN Host: {{ env_config[deploy_env].vite_nginx_host }}"
          - "  Images serve from: {{ env_config[deploy_env].vite_nginx_host }}/images"
          - "  Sounds serve from: {{ env_config[deploy_env].vite_nginx_host }}/sounds"
          - ""
          - "Verification:"
          - "  Frontend HTTP test: {{ 'PASSED ✓' if frontend_test is succeeded else 'FAILED ✗' }}"
          - "  Pod status: Ready"
          - "  Rollout status: {{ rollout_status.stdout_lines[-1] if rollout_status.stdout_lines else 'Completed' }}"
          - ""
          - "Access URLs:"
          - "  {{ 'Frontend: https://game.anhtran.dev/apps/golem-staging/' if deploy_env == 'staging' else 'Frontend: https://game.anhtran.dev/apps/golem/' }}"
          - "  CDN: {{ env_config[deploy_env].vite_nginx_host }}"
          - ""
          - "Recent pod logs:"
          - "{{ pod_logs.stdout_lines[0:10] | join('\n') }}"

    - name: Fail if frontend test failed
      fail:
        msg: "Frontend endpoint test failed. Check logs above."
      when: frontend_test is failed
