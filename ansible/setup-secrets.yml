---
# Ansible Playbook for Setting Up Environment Variables and Secrets
# This playbook sets up Firebase service account and environment variables
#
# Usage:
#   ansible-playbook -i ansible/inventory.ini ansible/setup-secrets.yml \
#     --extra-vars "firebase_sa_path=/path/to/firebase-service-account.json"

- name: Setup Environment Variables and Secrets
  hosts: deployment_servers
  become: yes
  
  vars:
    app_user: "{{ app_user | default('golem') }}"
    app_group: "{{ app_user }}"
    app_home: "/home/{{ app_user }}"
    app_dir: "{{ app_home }}/golem"
    sa_dir: "{{ app_dir }}/sa"
    env_file: "{{ app_dir }}/.env"
    shell_profile_dir: "/etc/profile.d"
    shell_env_file: "{{ shell_profile_dir }}/golem-env.sh"

  pre_tasks:
    - name: Validate required variables
      assert:
        that:
          - firebase_project_id is defined
          - firebase_project_id != ""
        fail_msg: "firebase_project_id must be defined"

  tasks:
    - name: Create app user if it doesn't exist
      user:
        name: "{{ app_user }}"
        home: "{{ app_home }}"
        shell: /bin/bash
        state: present
      register: app_user_result

    - name: Create app directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      loop:
        - "{{ app_dir }}"
        - "{{ sa_dir }}"

    - name: Create secure sa directory
      file:
        path: "{{ sa_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0700'

    - name: Copy Firebase service account
      copy:
        src: "{{ firebase_sa_path }}"
        dest: "{{ sa_dir }}/firebase-service-account.json"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0600'
      when: firebase_sa_path is defined
      register: sa_copy

    - name: Create .env file for application
      template:
        src: env.j2
        dest: "{{ env_file }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0600'
      vars:
        env_vars:
          SERVER_PORT: "{{ server_port | default('8080') }}"
          MONGO_URI: "{{ mongo_uri | default('mongodb://localhost:27017') }}"
          MONGO_DB: "{{ mongo_db | default('golem_game') }}"
          MONGO_EVENTS_COLL: "{{ mongo_events_coll | default('game_events') }}"
          MONGO_SNAPSHOTS_COLL: "{{ mongo_snapshots_coll | default('game_snapshots') }}"
          REDIS_ADDR: "{{ redis_addr | default('localhost:6379') }}"
          REDIS_DB: "{{ redis_db | default('0') }}"
          LOG_LEVEL: "{{ log_level | default('info') }}"
          LOG_FORMAT: "{{ log_format | default('json') }}"
          DEFAULT_TURN_TIMEOUT_SECONDS: "{{ default_turn_timeout | default('60') }}"
          MAX_CHAT_MESSAGES: "{{ max_chat_messages | default('10') }}"
          TELEGRAM_BOT_TOKEN: "{{ telegram_bot_token | default('') }}"
          TELEGRAM_CHAT_ID: "{{ telegram_chat_id | default('') }}"
          FIREBASE_PROJECT_ID: "{{ firebase_project_id }}"
          FIREBASE_CREDENTIALS_PATH: "{{ sa_dir }}/firebase-service-account.json"

    - name: Create shell environment file for deployment
      template:
        src: shell-env.sh.j2
        dest: "{{ shell_env_file }}"
        mode: '0644'
      vars:
        env_vars:
          SERVER_PORT: "{{ server_port | default('8080') }}"
          MONGO_URI: "{{ mongo_uri | default('mongodb://localhost:27017') }}"
          MONGO_DB: "{{ mongo_db | default('golem_game') }}"
          MONGO_EVENTS_COLL: "{{ mongo_events_coll | default('game_events') }}"
          MONGO_SNAPSHOTS_COLL: "{{ mongo_snapshots_coll | default('game_snapshots') }}"
          REDIS_ADDR: "{{ redis_addr | default('localhost:6379') }}"
          REDIS_DB: "{{ redis_db | default('0') }}"
          LOG_LEVEL: "{{ log_level | default('info') }}"
          LOG_FORMAT: "{{ log_format | default('json') }}"
          DEFAULT_TURN_TIMEOUT_SECONDS: "{{ default_turn_timeout | default('60') }}"
          MAX_CHAT_MESSAGES: "{{ max_chat_messages | default('10') }}"
          TELEGRAM_BOT_TOKEN: "{{ telegram_bot_token | default('') }}"
          TELEGRAM_CHAT_ID: "{{ telegram_chat_id | default('') }}"
          FIREBASE_PROJECT_ID: "{{ firebase_project_id }}"
          FIREBASE_CREDENTIALS_PATH: "{{ sa_dir }}/firebase-service-account.json"

    - name: Create systemd service environment file
      template:
        src: golem.env.j2
        dest: /etc/default/golem
        mode: '0600'
      vars:
        env_vars:
          SERVER_PORT: "{{ server_port | default('8080') }}"
          MONGO_URI: "{{ mongo_uri | default('mongodb://localhost:27017') }}"
          MONGO_DB: "{{ mongo_db | default('golem_game') }}"
          MONGO_EVENTS_COLL: "{{ mongo_events_coll | default('game_events') }}"
          MONGO_SNAPSHOTS_COLL: "{{ mongo_snapshots_coll | default('game_snapshots') }}"
          REDIS_ADDR: "{{ redis_addr | default('localhost:6379') }}"
          REDIS_DB: "{{ redis_db | default('0') }}"
          LOG_LEVEL: "{{ log_level | default('info') }}"
          LOG_FORMAT: "{{ log_format | default('json') }}"
          DEFAULT_TURN_TIMEOUT_SECONDS: "{{ default_turn_timeout | default('60') }}"
          MAX_CHAT_MESSAGES: "{{ max_chat_messages | default('10') }}"
          TELEGRAM_BOT_TOKEN: "{{ telegram_bot_token | default('') }}"
          TELEGRAM_CHAT_ID: "{{ telegram_chat_id | default('') }}"
          FIREBASE_PROJECT_ID: "{{ firebase_project_id }}"
          FIREBASE_CREDENTIALS_PATH: "{{ sa_dir }}/firebase-service-account.json"

    - name: Set permissions on environment files
      file:
        path: "{{ item }}"
        state: file
        mode: '0600'
      loop:
        - "{{ env_file }}"
        - /etc/default/golem

    - name: Verify Firebase service account file
      stat:
        path: "{{ sa_dir }}/firebase-service-account.json"
      register: sa_stat

    - name: Display setup summary
      debug:
        msg: |
          ✅ Environment Setup Complete
          
          Configuration:
          - App User: {{ app_user }}
          - App Directory: {{ app_dir }}
          - Service Account: {{ sa_dir }}/firebase-service-account.json (exists: {{ sa_stat.stat.exists }})
          - .env File: {{ env_file }}
          - Shell Environment: {{ shell_env_file }}
          - Systemd Environment: /etc/default/golem
          - Firebase Project ID: {{ firebase_project_id }}
          
          Next Steps:
          1. Source the shell environment: source {{ shell_env_file }}
          2. Verify variables: env | grep FIREBASE
          3. For Docker deployment: docker-compose up -d
          4. For Systemd deployment: systemctl start golem

  post_tasks:
    - name: Test environment variables
      shell: |
        set -a
        source {{ shell_env_file }}
        set +a
        echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
        echo "FIREBASE_CREDENTIALS_PATH=$FIREBASE_CREDENTIALS_PATH"
      register: env_test
      changed_when: false

    - name: Display environment test results
      debug:
        msg: "{{ env_test.stdout_lines }}"
