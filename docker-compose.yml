services:
  redis:
    image: redis:7-alpine
    container_name: golem-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  transport:
    build:
      context: .
      dockerfile: Dockerfile.transport
    container_name: golem-transport
    ports:
      - "127.0.0.1:8100:8000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis:6379
      - GAME_INSTANCES=http://golem-century-1:8080,http://golem-century-2:8080

  golem-century-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golem-century-1
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - FIRESTORE_PROJECT_ID=wsgames-cfa61
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

  golem-century-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golem-century-2
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - FIRESTORE_PROJECT_ID=wsgames-cfa61
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

volumes:
  redis_data:

